[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/recommend"
  to = "/.netlify/functions/recommend"
  status = 200

[[redirects]]
  from = "/api/watchlist"
  to = "/.netlify/functions/watchlist"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
